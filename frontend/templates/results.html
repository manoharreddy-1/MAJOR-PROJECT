<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATS Results | AI Resume Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">AI <span>Resume</span> Analyzer</a>
    <button class="nav-toggle" aria-label="Menu">&#9776;</button>
    <ul class="navbar-nav">
      <li><a href="/resume-analysis">Resume Analysis</a></li>
      <li><a href="/results" class="active">Results</a></li>
      <li><a href="/history">History</a></li>
      <li><a href="/profile">Profile</a></li>
    </ul>
  </nav>

  <div class="container">
    <div id="resultsContent">
      <div class="loading-overlay"><div class="loading-spinner"></div><p>Loading analysis results...</p></div>
    </div>
  </div>

  <footer class="footer"><p>AI Resume Analyzer &mdash; CSE(AI) Major Project</p></footer>

  <script src="/static/js/app.js"></script>
  <script>
    const container = document.getElementById('resultsContent');

    async function loadResults() {
      let data = Store.get('analysis_data');
      const analysisId = Store.get('analysis_id');

      if (!data && analysisId) {
        try {
          const res = await API.request(`/analysis/${analysisId}`);
          data = res.data;
        } catch (err) {
          UI.showError(container, 'No analysis found. Please run an analysis first.');
          return;
        }
      }

      if (!data) {
        UI.showEmpty(container, '&#128202;', 'No analysis results. <a href="/analyze">Start an analysis</a>');
        return;
      }

      renderResults(data);
    }

    function renderResults(data) {
      const scores = data.scores || {};
      const breakdown = data.score_breakdown || {};
      const skills = data.skill_analysis || {};

      container.innerHTML = `
        <div class="page-header text-center">
          <p class="text-muted">TARGET ROLE</p>
          <h1>${data.target_role || 'Target Role'}</h1>
          <span class="badge badge-${scores.overall >= 65 ? 'success' : scores.overall >= 50 ? 'warning' : 'error'}">${data.match_label || ''}</span>
        </div>

        <div class="grid-2">
          <div class="card text-center">
            ${UI.createScoreGauge(scores.overall, 'ATS Match Score')}
            <p class="text-muted mt-2">Overall weighted score from SBERT semantic analysis</p>
          </div>
          <div class="card">
            <h3 class="card-title mb-2">Score Breakdown</h3>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
              <div style="flex: 1.2; min-width: 200px;">
                ${UI.createProgressBar('Semantic Match', scores.semantic, 'semantic')}
                ${UI.createProgressBar('Skill Match', scores.skills, 'skills')}
                ${UI.createProgressBar('Experience Match', scores.experience, 'experience')}
                ${UI.createProgressBar('Education Match', scores.education, 'education')}
              </div>
              <div style="flex: 0.8; min-width: 180px; max-height: 200px; display: flex; justify-content: center; align-items: center;">
                <canvas id="radarChart" style="max-width: 180px; max-height: 180px;"></canvas>
              </div>
            </div>
          </div>
        </div>

        <div class="card mt-3">
          <h3 class="card-title mb-2">How This Score Was Calculated</h3>
          <div class="info-box">
            <p><strong>Semantic Match:</strong> ${scores.semantic}/100 &times; 45% = ${breakdown.components?.semantic?.weighted || 0}</p>
            <p><strong>Skill Match:</strong> ${scores.skills}/100 &times; 30% = ${breakdown.components?.skills?.weighted || 0}</p>
            <p><strong>Experience Match:</strong> ${scores.experience}/100 &times; 15% = ${breakdown.components?.experience?.weighted || 0}</p>
            <p><strong>Education Match:</strong> ${scores.education}/100 &times; 10% = ${breakdown.components?.education?.weighted || 0}</p>
            <p class="mt-1"><strong>Final: ${scores.overall}/100</strong></p>
          </div>
          <p class="text-muted" style="font-size: 0.8125rem;">${data.disclaimer || ''}</p>
        </div>

        <div class="grid-3 mt-3">
          <div class="card">
            <h3 class="card-title mb-2">Matched Skills</h3>
            <div class="skill-tags">${(skills.matched || []).map(s => `<span class="skill-tag matched">${s.skill}</span>`).join('') || '<p class="text-muted">None</p>'}</div>
          </div>
          <div class="card">
            <h3 class="card-title mb-2">Partially Matched</h3>
            <div class="skill-tags">${(skills.partial || []).map(s => `<span class="skill-tag partial">${s.skill}</span>`).join('') || '<p class="text-muted">None</p>'}</div>
          </div>
          <div class="card">
            <h3 class="card-title mb-2">Missing Skills</h3>
            <div class="skill-tags">${(skills.missing || []).map(s => `<span class="skill-tag missing">${s.skill}</span>`).join('') || '<p class="text-muted">None</p>'}</div>
          </div>
        </div>

        <!-- AI Resume Optimization Feature -->
        <div class="card mt-3" style="border: 2px solid var(--accent); background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);">
          <div class="flex-between" style="flex-wrap: wrap; gap: 1rem; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1rem;">
            <div>
              <div style="display: flex; align-items: center; gap: 0.5rem;">
                <span class="badge badge-success" style="font-weight: 800; font-size: 0.75rem; letter-spacing: 0.05em;">AI ASSISTANT</span>
                <h2 style="font-size: 1.35rem; font-weight: 800; color: var(--primary); margin: 0;">✨ Create Resume with AI</h2>
              </div>
              <p class="text-muted mt-1" style="font-size: 0.875rem; margin-bottom: 0;">
                Automatically bridge missing skill gaps by ethically weaving required skills into standard ATS categories and project bullets without manual editing.
              </p>
            </div>
            <div style="text-align: right;">
              <button id="createResumeAiBtn" class="btn btn-primary btn-lg" onclick="triggerResumeOptimization()" style="font-weight: 800; padding: 0.75rem 1.5rem; font-size: 1rem; display: inline-flex; align-items: center; gap: 0.5rem; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);">
                <span>✨</span> Create Resume with AI
              </button>
              <div class="text-muted mt-1" style="font-size: 0.75rem; font-style: italic;">
                ⚠️ AI only adds skills supported by your experience. Review before applying.
              </div>
            </div>
          </div>

          <!-- Dynamic Results Container -->
          <div id="aiResumeContainer" style="display: none;">
            <!-- Loading State -->
            <div id="aiResumeLoading" style="display: none; text-align: center; padding: 3rem 1rem;">
              <div class="loading-spinner" style="margin: 0 auto 1rem auto; width: 44px; height: 44px;"></div>
              <h3 style="font-weight: 800; color: var(--primary); font-size: 1.2rem;">Optimizing your resume with AI…</h3>
              <p class="text-muted" style="max-width: 500px; margin: 0.5rem auto 0 auto; font-size: 0.875rem;">
                Analyzing verifiable context, structuring technical categories, weaving supporting evidence into bullets, and recalculating your genuine ATS match score...
              </p>
            </div>

            <!-- Optimization Results Display -->
            <div id="aiResumeResults" style="display: none;">
              <!-- Score Delta Banner -->
              <div class="card mb-3" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; border-radius: var(--radius-lg); padding: 1.5rem;">
                <div class="flex-between" style="flex-wrap: wrap; gap: 1rem; align-items: center;">
                  <div>
                    <span style="background: rgba(34, 197, 94, 0.2); color: #4ade80; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.8125rem; font-weight: 800;">
                      ✓ ATS SCORE RECALCULATED
                    </span>
                    <div style="display: flex; align-items: baseline; gap: 1rem; margin-top: 0.75rem;">
                      <div style="font-size: 1.1rem; color: #94a3b8;">Original: <span id="optOldScore" style="font-weight: 800; color: white;">--%</span></div>
                      <div style="font-size: 1.75rem; font-weight: 900; color: #38bdf8;">&rarr;</div>
                      <div style="font-size: 1.5rem; font-weight: 900; color: #4ade80;">Optimized: <span id="optNewScore">--%</span></div>
                      <span id="optScoreDeltaBadge" class="badge badge-success" style="font-size: 0.9375rem; padding: 0.35rem 0.75rem;">+--% ATS Boost</span>
                    </div>
                    <p id="optChangesSummary" style="color: #cbd5e1; font-size: 0.875rem; margin-top: 0.5rem; margin-bottom: 0; line-height: 1.4;"></p>
                  </div>
                  <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                    <button class="btn btn-primary" onclick="downloadOptimizedDocx()" style="background: #2563eb; border-color: #2563eb; font-weight: 700;">
                      📥 Download DOCX
                    </button>
                    <button class="btn btn-primary" onclick="downloadOptimizedPdf()" style="background: #ef4444; border-color: #ef4444; font-weight: 700;">
                      📥 Download PDF
                    </button>
                    <button class="btn btn-secondary" onclick="copyOptimizedText()" style="font-weight: 700;">
                      📋 Copy Text
                    </button>
                  </div>
                </div>
              </div>

              <!-- Added Skills & Placement Tags -->
              <div class="card mb-3">
                <h4 style="font-size: 1rem; font-weight: 800; margin-bottom: 0.75rem; color: var(--primary);">Skills Added & Placement</h4>
                <div id="optAddedSkillsList" style="display: flex; flex-wrap: wrap; gap: 0.5rem;"></div>
              </div>

              <!-- Needs User Confirmation (if any) -->
              <div id="optConfirmationBox" class="card mb-3" style="display: none; border-left: 4px solid var(--warning); background: #fffbeb;">
                <h4 style="font-size: 1rem; font-weight: 800; color: #b45309; margin-bottom: 0.5rem;">
                  ⚠️ Skills Requiring Your Confirmation
                </h4>
                <p class="text-muted" style="font-size: 0.8125rem; margin-bottom: 0.75rem;">
                  To prevent false claims, these required skills were not added automatically because no supporting project context was found. Tick any skill you have hands-on experience with to incorporate it:
                </p>
                <div id="optConfirmationCheckboxes" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
                <button id="reoptimizeConfirmedBtn" class="btn btn-sm btn-primary mt-2" onclick="reoptimizeWithConfirmedSkills()" style="align-self: flex-start;">
                  Add Selected Confirmed Skills &rarr;
                </button>
              </div>

              <!-- Side-by-Side Resume Comparison (Original vs Optimized) -->
              <div class="grid-2">
                <div class="card">
                  <div class="flex-between" style="border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 1rem;">
                    <h4 style="font-size: 1.05rem; font-weight: 800; color: var(--primary); margin: 0;">Original Resume</h4>
                    <span class="badge" style="background: #e2e8f0; color: #475569;">Read-only</span>
                  </div>
                  <div id="originalResumePreview" class="resume-preview-panel" style="font-family: inherit; font-size: 0.875rem; line-height: 1.6; max-height: 600px; overflow-y: auto; padding-right: 0.5rem;"></div>
                </div>

                <div class="card">
                  <div class="flex-between" style="border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 1rem;">
                    <h4 style="font-size: 1.05rem; font-weight: 800; color: var(--accent); margin: 0;">AI-Optimized Resume (Editable)</h4>
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                      <span class="badge badge-success">✨ Enhanced</span>
                      <button class="btn btn-sm btn-secondary" onclick="resetOptimizedEdits()" style="font-size: 0.75rem; padding: 0.2rem 0.5rem;">Reset</button>
                    </div>
                  </div>
                  <div id="optimizedResumePreview" class="resume-preview-panel" contenteditable="true" style="font-family: inherit; font-size: 0.875rem; line-height: 1.6; max-height: 600px; overflow-y: auto; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); background: #ffffff;"></div>
                  <p class="text-muted mt-2" style="font-size: 0.75rem;">
                    ✎ You can click and edit any text in the right panel above before exporting. Newly added skills and sections are highlighted in green.
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="grid-2 mt-3">
          <div class="card">
            <h3 class="card-title mb-2">Resume Strengths</h3>
            <ul>${(data.strengths || []).map(s => `<li style="margin-bottom: 0.5rem;">${s}</li>`).join('')}</ul>
          </div>
          <div class="card">
            <h3 class="card-title mb-2">Areas to Improve</h3>
            <ul>${(data.improvements || []).map(s => `<li style="margin-bottom: 0.5rem;">${s}</li>`).join('')}</ul>
          </div>
        </div>

        <div class="card mt-3" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; padding: 1.5rem 2rem;">
          <div class="flex-between" style="flex-wrap: wrap; gap: 1rem; align-items: center;">
            <div>
              <span style="background: rgba(56, 189, 248, 0.2); color: #38bdf8; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700;">NEW GENERATION AI LEARNING</span>
              <h3 style="font-size: 1.25rem; font-weight: 800; margin: 0.5rem 0 0.25rem 0; color: white;">Bridge Your Skill Gaps with AI Course Generator</h3>
              <p style="color: #cbd5e1; font-size: 0.875rem; margin: 0;">Auto-create personalized courses, video lectures, coding compilers, and quizzes targeted to your missing skills.</p>
            </div>
            <a href="/courses?topic=${encodeURIComponent((skills.missing && skills.missing[0] && skills.missing[0].skill) || data.target_role || 'Software Engineering')}" class="btn btn-primary" style="background: #38bdf8; border-color: #38bdf8; color: #0f172a; font-weight: 700;">
              &#10024; Generate AI Course &rarr;
            </a>
          </div>
        </div>

        <div class="flex mt-4" style="gap: 1rem; flex-wrap: wrap; justify-content: center;">
          <a href="/skills" class="btn btn-primary">Skill Gap Analysis</a>
          <a href="/improve" class="btn btn-secondary">Resume Improvement</a>
          <a href="/interview" class="btn btn-outline">Interview Prep</a>
          <a href="/roadmap" class="btn btn-outline">Preparation Roadmap</a>
          <a href="/courses" class="btn btn-outline">AI Courses</a>
        </div>`;

      // Render Chart.js radar graph
      const ctx = document.getElementById('radarChart')?.getContext('2d');
      if (ctx) {
        new Chart(ctx, {
          type: 'radar',
          data: {
            labels: ['Semantic', 'Skills', 'Experience', 'Education'],
            datasets: [{
              data: [scores.semantic, scores.skills, scores.experience, scores.education],
              backgroundColor: 'rgba(14, 165, 233, 0.2)',
              borderColor: 'rgba(14, 165, 233, 1)',
              borderWidth: 2,
              pointBackgroundColor: 'rgba(14, 165, 233, 1)',
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              r: {
                min: 0,
                max: 100,
                beginAtZero: true,
                ticks: { display: false, stepSize: 20 },
                pointLabels: { font: { family: 'Inter', size: 9, weight: '600' } }
              }
            },
            plugins: {
              legend: { display: false }
            }
          }
        });
      }
    }

    loadResults();
  </script>
</body>
</html>
